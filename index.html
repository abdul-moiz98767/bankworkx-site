<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BankworkX — Coming Soon</title>
<meta name="description" content="New era of AI banking coming soon. Stay tuned!">
<meta name="theme-color" content="#000">
<meta property="og:title" content="BankworkX — Coming Soon">
<meta property="og:description" content="New era of AI banking coming soon. Stay tuned!">
<meta property="og:image" content="https://bankworkx.com/1793867542774_image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#03ecfa;--cyan2:#18b8f0;--bg:#00060c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse 60% 55% at 50% 50%, rgba(0,6,12,.4), rgba(0,6,12,.05) 70%),
      url("bg.webp") center/cover no-repeat,
      var(--bg);
    color:#fff;font-family:'Poppins',system-ui,sans-serif;
    overflow:hidden;text-align:center;padding:24px 16px;
  }
  @media (max-aspect-ratio:1/1){body{background-position:center,58% center,center}}
  main{position:relative;z-index:1;max-width:900px;animation:rise 1s ease-out both}
  .logo{display:block;width:clamp(200px,26vw,320px);height:auto;margin:0 auto clamp(28px,5vh,48px)}
  h1{font-weight:400;text-shadow:0 2px 12px rgba(0,0,0,.6);font-size:clamp(28px,6vw,58px);line-height:1.25;margin:0;letter-spacing:-.5px}
  h1 b{font-weight:700;color:var(--cyan)}
  .tuned{font-weight:700;font-size:clamp(40px,9vw,84px);margin:clamp(32px,7vh,64px) 0 0;letter-spacing:-1px;
    text-shadow:0 0 18px rgba(3,236,250,.55),0 0 50px rgba(3,236,250,.3)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.webp" alt="BankworkX" width="504" height="120">
    <h1>New era of <b>AI banking</b><br>coming soon....</h1>
    <p class="tuned">Stay tuned!</p>
  </main>
</body>
</html>
